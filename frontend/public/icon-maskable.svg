      </g>
      <g transform="rotate(216)">
        <path d="M 0 -22 Q -52 -52 -37 -104 Q 0 -128 37 -104 Q 52 -52 0 -22 Z" fill="url(#petal)"/>
      </g>
      <g transform="rotate(288)">
