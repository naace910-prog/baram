server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30d
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param

spring:
  application:
    name: wind-guild
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/guild;AUTO_SERVER=TRUE;MODE=MySQL}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  session:
    store-type: jdbc
    timeout: 30d
    jdbc:
      initialize-schema: always
      table-name: SPRING_SESSION
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console

push:
  vapid-public-key: ${VAPID_PUBLIC_KEY:}
  vapid-private-key: ${VAPID_PRIVATE_KEY:}
  subject: ${PUSH_SUBJECT:mailto:admin@example.com}

discord:
  enabled: ${DISCORD_ENABLED:false}
  bot-token: ${DISCORD_BOT_TOKEN:}
  guild-id: ${DISCORD_GUILD_ID:}
  notify-channel-id: ${DISCORD_NOTIFY_CHANNEL_ID:}
  chat-channel-id: ${DISCORD_CHAT_CHANNEL_ID:}
  webhook-url: ${DISCORD_WEBHOOK_URL:}
  site-base-url: ${SITE_BASE_URL:http://localhost:5173}
  client-id: ${DISCORD_CLIENT_ID:}
  client-secret: ${DISCORD_CLIENT_SECRET:}
  oauth-redirect-uri: ${DISCORD_OAUTH_REDIRECT_URI:http://localhost:8080/api/auth/discord/callback}
  oauth-login-success-redirect: ${DISCORD_OAUTH_SUCCESS_REDIRECT:http://localhost:5173/}

logging:
  level:
    org.springframework.security: INFO
    com.wind.guild: INFO
    net.dv8tion.jda: WARN
